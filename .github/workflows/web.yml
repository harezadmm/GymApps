# Uji, build web, dan (kalau token Vercel tersedia) deploy ke produksi.
#
# Deploy hanya jalan kalau secret VERCEL_TOKEN diisi — tanpa itu alur ini
# tetap berguna sebagai CI: analyze + test + memastikan build web tidak rusak.
#
# Secret yang dibutuhkan (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY  — publishable key, bukan secret key
#   VERCEL_TOKEN                     — dari vercel.com/account/tokens
# Variabel (bukan secret): VERCEL_ORG_ID, VERCEL_PROJECT_ID.
name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test
      - name: Build web
        working-directory: app
        run: >
          flutter build web --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Deploy ke Vercel
        if: github.ref == 'refs/heads/main' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy app/build/web --prod --yes --token="$VERCEL_TOKEN"
