# Uji, build web, dan (kalau token Vercel tersedia) deploy ke produksi.
#
# Deploy hanya jalan kalau secret VERCEL_TOKEN diisi — tanpa itu alur ini
# tetap berguna sebagai CI: analyze + test + memastikan build web tidak rusak.
#
# Secret yang dibutuhkan (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY  — publishable key, bukan secret key
#   VERCEL_TOKEN                     — dari vercel.com/account/tokens
#   VAPID_PUBLIC_KEY                 — kunci publik notifikasi istirahat
#                                      (.secrets/vapid.json); boleh kosong,
#                                      tapi tanpa itu notifikasi web mati
# Variabel (bukan secret): VERCEL_ORG_ID, VERCEL_PROJECT_ID.
name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test
      # Secret yang kosong menghasilkan build yang jalan tapi tanpa server.
      # Di main itu tidak boleh lolos; di PR (tanpa secret) build tetap dicek.
      - name: Pastikan kredensial Supabase ada
        if: github.ref == 'refs/heads/main'
        run: |
          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] || { echo '::error::SUPABASE_URL / SUPABASE_ANON_KEY kosong'; exit 1; }
          case "$SUPABASE_ANON_KEY" in sb_secret_*) echo '::error::itu secret key, bukan publishable key'; exit 1;; esac
      # --no-web-resources-cdn: CanvasKit ikut dilayani dari origin aplikasi,
      # bukan dari CDN Google, supaya masuk precache dan aplikasi bisa dibuka
      # tanpa sinyal. Tanpa itu sw.js tidak boleh menyentuh permintaan lintas
      # origin, dan CanvasKit hilang begitu jaringan hilang.
      - name: Build web
        working-directory: app
        run: >
          flutter build web --release --no-web-resources-cdn
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          --dart-define=VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY"
      # Daftar berkas yang disimpan sw.js untuk mode offline (NFR-4). Sama
      # seperti scripts/deploy-web.ps1: harus dibuat dari hasil build yang
      # persis akan diunggah.
      - name: Manifest precache
        run: node scripts/gen-precache-manifest.mjs
      # Buka hasil build di Chromium, putus jaringan, muat ulang: halaman harus
      # tetap tampil dari cache (scripts/check-web-offline.mjs, ±3 detik).
      # Playwright tidak ada di package.json; dipasang global di sini. Kalau
      # pemasangan browsernya gagal, skripnya melewati uji, bukan gagal.
      - name: Uji buka offline
        run: |
          npm i -g playwright@1.56.1 && npx playwright install --with-deps chromium || echo '::warning::Chromium Playwright tidak terpasang, uji offline dilewati'
          NODE_PATH="$(npm root -g)" node scripts/check-web-offline.mjs
      - name: Deploy ke Vercel
        if: github.ref == 'refs/heads/main' && env.VERCEL_TOKEN != '' && env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        # Sama seperti scripts/deploy-web.ps1: fungsi server (alarm istirahat)
        # dan vercel.json (header keamanan, header sw.js) ikut diunggah.
        # Tanpa ini deploy CI menghapus /api/rest-alarm dari produksi.
        run: |
          cp -r web-api/api web-api/package.json web-api/vercel.json app/build/web/
          npx vercel@latest deploy app/build/web --prod --yes --token="$VERCEL_TOKEN"
